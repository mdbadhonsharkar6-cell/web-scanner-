<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Direct Linker</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 20px; text-align: center; background-color: #075e54; color: #fff; }
        .card { background: white; color: #333; padding: 25px; border-radius: 12px; max-width: 400px; margin: 30px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h3 { color: #075e54; margin-top: 0; }
        p { font-size: 14px; color: #555; }
        input { width: 90%; padding: 12px; margin: 15px 0; border: 2px solid #25D366; border-radius: 8px; font-size: 16px; box-sizing: border-box; outline: none; }
        button { background-color: #25D366; color: white; border: none; padding: 14px 20px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 90%; margin-top: 10px; }
        button:hover { background-color: #1ebd56; }
    </style>
</head>
<body>

    <div class="card">
        <h3>WhatsApp Linked Devices</h3>
        <p>আপনার নম্বর দিয়ে বোতামে চাপ দিন:</p>
        
        <input type="number" id="phone" placeholder="8801700000000">

        <button onclick="openWhatsApp()">WhatsApp খুলুন</button>
    </div>

    <script>
        function openWhatsApp() {
            let number = document.getElementById("phone").value.trim();
            if (number === "") {
                alert("দয়া করে কান্ট্রি কোড সহ সঠিক নম্বর দিন!");
                return;
            }

            // ইউনিভার্সাল স্কিম যা ফোনে থাকা সঠিক অ্যাপে লিঙ্ক ওপেন করার ডায়ালগ/অপশন পাঠায়
            let primaryUrl = "whatsapp://settings/linked_devices";
            
            // ইউনিভার্সাল অটোমেটিক রিডাইরেক্ট 
            window.location.href = primaryUrl;

            // ব্যাকআপ সিস্টেম: যদি ফোনে ডাইরেক্ট স্কিম লোড হতে দেরি হয়, তবে এটি সঠিক চ্যাট পেজে নিয়ে অ্যাপটি ওপেন করে দেবে
            setTimeout(function() {
                window.location.href = "https://api.whatsapp.com/send?phone=" + number;
            }, 1200);
        }
    </script>

</body>
</html>
