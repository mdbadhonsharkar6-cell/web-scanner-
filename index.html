<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick WhatsApp Web Launcher</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; text-align: center; background-color: #e5ddd5; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); max-width: 450px; margin: auto; }
        h2 { color: #075e54; margin-bottom: 10px; }
        p { color: #555; font-size: 14px; }
        input { width: 100%; padding: 14px; margin: 15px 0; border: 2px solid #25D366; border-radius: 8px; font-size: 16px; box-sizing: border-box; outline: none; }
        .btn-web { background-color: #075e54; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
        .btn-chat { background-color: #25D366; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
        .btn-web:hover { background-color: #054c44; }
        .btn-chat:hover { background-color: #1ebd56; }
    </style>
</head>
<body>

    <div class="container">
        <h2>WhatsApp Quick Web Launcher</h2>
        <p>সহজেই যেকোনো নম্বরের মাধ্যমে WhatsApp Web লিঙ্কে যুক্ত হন</p>
        
        <input type="number" id="phone" placeholder="কান্ট্রি কোড সহ নম্বর (যেমন: 8801700000000)">
        
        <button class="btn-web" onclick="openWhatsAppWeb()">WhatsApp Web লিঙ্ক চালু করুন</button>
        <button class="btn-chat" onclick="openDirectChat()">সরাসরি চ্যাট লিঙ্কে যান</button>
    </div>

    <script>
        function openWhatsAppWeb() {
            let number = document.getElementById("phone").value.trim();
            if (number === "") {
                alert("দয়া করে একটি সঠিক নম্বর দিন!");
                return;
            }
            // WhatsApp Web-এর সেশন কানেক্ট লিংক
            let webUrl = "https://web.whatsapp.com/send?phone=" + number;
            window.open(webUrl, '_blank');
        }

        function openDirectChat() {
            let number = document.getElementById("phone").value.trim();
            if (number === "") {
                alert("দয়া করে একটি সঠিক নম্বর দিন!");
                return;
            }
            // সরাসরি চ্যাট লিংক
            let chatUrl = "https://api.whatsapp.com/send?phone=" + number;
            window.open(chatUrl, '_blank');
        }
    </script>

</body>
</html>
