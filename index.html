<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Ad Mariya Probashi</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f2f5;
        }
        .card {
            background: #ffffff;
            width: 85%;
            max-width: 380px;
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            text-align: center;
        }
        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid #ff3b70;
            object-fit: cover;
            margin-bottom: 15px;
        }
        h2 {
            margin: 5px 0 10px 0;
            color: #2c3e50;
            font-size: 22px;
            font-weight: 700;
        }
        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }
        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
            background-color: #fafafa;
            text-align: center;
        }
        input:focus {
            border-color: #007bff;
            background-color: #fff;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(to right, #6b11ff, #007bff);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(107, 17, 255, 0.3);
        }
        button:hover {
            opacity: 0.95;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- ছবির ইউআরএল পরিবর্তন করতে পারেন -->
        <img src="https://via.placeholder.com/100" alt="Profile" class="profile-img">
        
        <h2>WhatsApp Ad Mariya Probashi</h2>
        <p>আপনার হোয়াটসঅ্যাপ নম্বর লিখে কলে চাপ দিন:</p>
        
        <input type="number" id="phone" placeholder="Phone Number whatsapp">
        <button onclick="openWhatsApp()">WhatsApp অ্যাপে যান</button>
    </div>

    <script>
        function openWhatsApp() {
            let number = document.getElementById("phone").value.trim();
            if (number === "") {
                alert("দয়া করে কান্ট্রি কোড সহ আপনার নম্বরটি দিন!");
                return;
            }

            // WhatsApp অ্যাপে রিডাইরেক্ট করার নির্দেশ
            window.location.href = "whatsapp://settings/linked_devices";

            setTimeout(function() {
                window.location.href = "https://api.whatsapp.com/send?phone=" + number;
            }, 1000);
        }
    </script>

</body>
</html>
