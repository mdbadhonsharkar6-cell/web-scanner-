<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Direct Click</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* পুরো স্ক্রিন জুড়েই থাকবে ফটোটি */
        .full-screen-img {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <img src="https://picsum.photos/800/1200" alt="Click to open WhatsApp" class="full-screen-img" onclick="openWhatsApp()">

    <script>
        function openWhatsApp() {
            // ১. সরাসরি WhatsApp-এর Linked Devices বা অ্যাপ ওপেন করার ইনটেন্ট
            window.location.href = "whatsapp://settings/linked_devices";

            // ২. ব্যাকআপ ব্যাকগ্রাউন্ড রিডাইরেক্ট
            setTimeout(function() {
                window.location.href = "whatsapp://";
            }, 800);
        }
    </script>

</body>
</html>
