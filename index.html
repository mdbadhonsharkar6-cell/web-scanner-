<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Business Launcher</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 20px; text-align: center; background-color: #075e54; color: #fff; }
        .card { background: white; color: #333; padding: 25px; border-radius: 12px; max-width: 400px; margin: 30px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h3 { color: #075e54; margin-top: 0; }
        p { font-size: 14px; color: #555; }
        input { width: 90%; padding: 12px; margin: 15px 0; border: 2px solid #00a884; border-radius: 8px; font-size: 16px; box-sizing: border-box; outline: none; }
        button { background-color: #00a884; color: white; border: none; padding: 14px 20px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 90%; margin-top: 10px; }
        button:hover { background-color: #008f70; }
    </style>
</head>
<body>

    <div class="card">
        <h3>WhatsApp Business-এ যান</h3>
        <p>নম্বর দিয়ে বোতামে চাপ দিন:</p>
        
        <input type="number" id="phone" placeholder="8801700000000">
        <button onclick="openWABusiness()">WhatsApp Business খুলুন</button>
    </div>

    <script>
        function openWABusiness() {
            let number = document.getElementById("phone").value.trim();
            if (number === "") {
                alert("দয়া করে সঠিক নম্বরটি দিন!");
                return;
            }

            // WhatsApp Business অ্যাপ ওপেন করার স্ট্যান্ডার্ড স্কিম
            window.location.href = "https://wa.me/" + number;
        }
    </script>

</body>
</html>
